<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/style.css" />
        <script type='module' src="/src/main.js"></script>
        <title>To-do List</title>
    </head>
    <body class="app-body text-white min-h-screen">
        <div class="app-shell">
            <nav class="app-sidebar">
                <div class="sidebar-copy">
                    <p class="eyebrow">Workspace</p>
                    <h2 class="sidebar-title">Sections</h2>
                    <p class="sidebar-description">
                        Organize your day into focused task groups.
                    </p>
                </div>
                <div class="section-list" id="section-list">
                    <button class="section-item focused" id="all-tasks">
                        All
                    </button>
                </div>
                <div class="sidebar-actions">
                    <button
                        id="section-button"
                        class="action-button action-button--primary"
                    >
                        Create new section
                    </button>
                    <button
                        id="section-removal"
                        class="action-button action-button--danger"
                    >
                        Remove section
                    </button>
                </div>
                <button
                    id="sidebar-close"
                    class="sidebar-close action-button action-button--accent"
                >
                    Close panel
                </button>
            </nav>
            <button
                id="sidebar-backdrop"
                class="sidebar-backdrop"
                aria-label="Close sections panel"
                type="button"
            ></button>
            <div class="content-panel">
                <header class="app-header">
                    <div>
                        <p class="eyebrow">Daily planning</p>
                        <h1 class="app-title">Todo List</h1>
                    </div>
                    <button
                        id="sidebar-toggle"
                        class="sidebar-toggle"
                        aria-expanded="false"
                        aria-controls="section-list"
                        aria-label="Open sections menu"
                    >
                        <span class="sidebar-toggle-icon" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                    </button>
                    <button
                        id="task-button"
                        class="action-button action-button--accent"
                    >
                        Add new task
                    </button>
                </header>
                <div class="task-grid" id="task-container"></div>
            </div>
            <dialog id="dialog1" class="dialog-surface">
                <form method="dialog" class="dialog-form" id="task-form">
                    <h2 class="dialog-title">Create new task</h2>
                    <input
                        id="task-title"
                        type="text"
                        placeholder="Task title"
                        class="field"
                    />
                    <textarea
                        id="task-description"
                        placeholder="Task description"
                        class="field field--textarea"
                    ></textarea>
                    <input
                        id="task-due-date"
                        type="date"
                        class="field"
                    />
                    <select
                        id="task-priority"
                        class="field"
                    >
                        <option value="" disabled selected>
                            Select priority
                        </option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                    <div class="dialog-actions">
                        <button
                            type="submit"
                            id="task-submit"
                            class="action-button action-button--primary"
                        >
                            Create
                        </button>
                        <button
                            type="reset"
                            id="task-cancel"
                            class="action-button action-button--danger"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </dialog>
            <dialog id="dialog2" class="dialog-surface">
                <form method="dialog" class="dialog-form" id="section-form">
                    <h2 class="dialog-title">Create new section</h2>
                    <input
                        id="section-name"
                        type="text"
                        placeholder="Section name"
                        class="field"
                    />
                    <div class="dialog-actions">
                        <button
                            type="submit"
                            id="section-submit"
                            class="action-button action-button--primary"
                        >
                            Create
                        </button>
                        <button
                            type="reset"
                            id="section-cancel"
                            class="action-button action-button--danger"
                        >
                            Cancel
                        </button>
                    </div>
                </form>
            </dialog>
            <!-- <dialog id="dialog3"> -->
        </div>
    </body>
</html>
